name: build cesium iso

on:
  push:
    branches: [cesium]
  workflow_dispatch:
    inputs:
      kver:
        description: "kernel version (empty = 7.3)"
        required: false
        default: "7.3"

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: resolve kernel version
        id: kver
        run: |
          V="${{ inputs.kver }}"
          [ -n "$V" ] || V="7.3"
          echo "kver=$V" >> "$GITHUB_OUTPUT"
          echo "building kernel $V"

      - name: build iso
        env:
          KVER: ${{ steps.kver.outputs.kver }}
          WORK: /mnt/cesium-build
          CESIUM_PASSWORD: ${{ secrets.CESIUM_PASSWORD }}
        run: |
          sudo mkdir -p "$WORK"
          sudo -E ./build-iso.sh

      - name: upload iso
        uses: actions/upload-artifact@v4
        with:
          name: cesium-iso
          path: |
            /mnt/cesium-build/cesium-*.iso
            /mnt/cesium-build/cesium-password.txt
          retention-days: 14
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: mod
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cesium-mod
          path: mod/build/libs/cesium-mod-*.jar
          if-no-files-found: error

  build-launcher-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build launcher (shaded jar)
        working-directory: launcher
        run: mvn -B -q clean package -Djavafx.platform=linux

      - name: Upload launcher jar
        uses: actions/upload-artifact@v4
        with:
          name: cesium-launcher-jar
          path: launcher/target/cesium-launcher.jar
          if-no-files-found: error

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build launcher jar
        working-directory: launcher
        run: mvn -B -q clean package -Djavafx.platform=win

      - name: Package Windows app-image (Cesium.exe)
        working-directory: launcher
        shell: cmd
        run: |
          if exist dist rmdir /s /q dist
          jpackage --type app-image --name Cesium --app-version 1.0.0 --input target --main-jar cesium-launcher.jar --main-class dev.cesium.launcher.Main --dest dist

      - name: Zip Windows portable
        working-directory: launcher
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Cesium -DestinationPath cesium-windows-portable.zip

      - name: Upload Windows exe zip
        uses: actions/upload-artifact@v4
        with:
          name: cesium-windows
          path: launcher/cesium-windows-portable.zip
          if-no-files-found: error

  release:
    needs: [build-mod, build-launcher-jar, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Cesium ${{ steps.tag.outputs.name }}
          body: |
            ## Cesium ${{ steps.tag.outputs.name }}

            Acid-minimal Minecraft client (Fabric 1.21.11) + JavaFX launcher.

            ### Assets
            - **cesium-mod-*.jar** — Fabric mod (drop into `mods/`)
            - **cesium-launcher.jar** — shaded launcher (needs Java 21+)
            - **cesium-windows-portable.zip** — portable Windows app with `Cesium.exe`

            Built automatically by GitHub Actions.
          files: |
            artifacts/cesium-mod/*
            artifacts/cesium-launcher-jar/*
            artifacts/cesium-windows/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
